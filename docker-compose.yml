# Runs ControlLayer and its database:
#   docker compose up -d
# then open http://localhost:3000 to create the first admin account.
# Put settings (cloud credentials, ORGANIZATION_NAME, ...) in a .env file next
# to this one; see .env.example.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: controllayer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: controllayer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controllayer"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Exposed for local development (npm run dev). Remove in production.
    ports:
      - "5433:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://controllayer:${POSTGRES_PASSWORD:-changeme}@db:5432/controllayer
    ports:
      - "3000:3000"

volumes:
  postgres_data:
